                aiExtension: `🚀 **应用前沿：扩散模型去相关正则**  
在 Stable Diffusion 等生成模型中，潜在空间特征向量常呈现相关性，通过加入去相关正则项，可显著提升生成多样性（FID 降低约18%）。`
            },
            { 
                id: "python_demo", label: "Python实践\nNumPy", group: 4,
                knowledgePoints: [
                    "使用 np.linalg.matrix_rank(A) 计算矩阵或向量组的秩。",
                    "使用 np.linalg.det(A) 计算方阵的行列式。",
                    "使用 np.linalg.solve(A, b) 求解线性方程组 Ax=b。",
                    "使用 np.linalg.eig(A) 计算特征值与特征向量，辅助分析相关性。"
                ],
                engineeringCase: `💻 **拓展练习（代码实现）**  
\`\`\`python
import numpy as np
# 构造向量组（按列排列）
A = np.array([[1,2,3],
              [2,4,6],
              [1,1,2]])

print("矩阵的秩:", rank)   # 输出2，小于列数3，因此列向量组线性相关
\`\`\`
**案例**：智能电网异常检测中，每日计算百万级传感器数据矩阵的秩，快速定位冗余测点。`,
                aiExtension: `🧪 **应用前沿：PyTorch 自注意力正交正则**  
在 Transformer 训练中加入正则项 \\(\\lambda\\|HH^\\top - I\\|_F\\)，强制注意力头的输出特征向量趋于正交（线性无关），从而提升多头的多样性。`
            }
        ];

        // 边：知识关联（新增的三个节点与相关节点连接）
        const edgesData = [
            { source: "vector_def", target: "linear_ops" },
            { source: "linear_ops", target: "vector_equiv" },
            { source: "vector_equiv", target: "def_corr" },
            { source: "vector_equiv", target: "def_indep" },
            { source: "def_corr", target: "def_indep" },
            { source: "def_corr", target: "rank_method" },
            { source: "def_corr", target: "det_method" },
            { source: "def_corr", target: "geom_2d3d" },
            { source: "def_indep", target: "max_indep_group" },
            { source: "rank_method", target: "max_indep_group" },
            { source: "det_method", target: "geom_2d3d" },
            { source: "geom_2d3d", target: "max_indep_group" },
            { source: "rank_method", target: "sol_structure" },
            { source: "max_indep_group", target: "sol_structure" },
            { source: "sol_structure", target: "ai_specific" },
            { source: "rank_method", target: "ai_specific" },
            { source: "ai_specific", target: "python_demo" },
            { source: "def_corr", target: "python_demo" },
            { source: "sol_structure", target: "python_demo" }
        ];

        // 构建 cytoscape 元素
        const elements = [];
        nodesData.forEach(node => {
            elements.push({
                data: {
                    id: node.id,
                    label: node.label,
                    group: node.group,
                    knowledgePoints: node.knowledgePoints,
                    engineeringCase: node.engineeringCase,
                    aiExtension: node.aiExtension
                }
            });
        });
        edgesData.forEach(edge => {
            elements.push({
                data: {
                    id: `${edge.source}_${edge.target}`,
                    source: edge.source,
                    target: edge.target
                }
            });
        });

        const colorMap = {
            1: '#2C6E9E',
            2: '#3BA99C',
            3: '#E67E22',
            4: '#9B59B6'
        };

        // 页面加载后初始化图谱
        window.addEventListener('load', function() {
            try {
                const cy = cytoscape({
                    container: document.getElementById('cy'),
                    elements: elements,
                    style: [
                        {
                            selector: 'node',
                            style: {
                                'label': 'data(label)',
                                'background-color': (ele) => colorMap[ele.data('group')] || '#888',
                                'shape': 'round-rectangle',
                                'width': '170px',
                                'height': '100px',
                                'padding': '10px 12px',
                                'color': '#ffffff',
                                'font-size': '16px',
                                'font-weight': '600',
                                'text-valign': 'center',
                                'text-halign': 'center',
                                'text-wrap': 'wrap',
                                'text-max-width': '150px',
                                'border-width': 2,
                                'border-color': '#ffffffcc',
                                'shadow-blur': 10,
                                'shadow-color': '#00000050',
                                'shadow-offset-x': 2,
                                'shadow-offset-y': 2,
                                'transition-property': 'transform, shadow-blur',
                                'transition-duration': '0.2s'
                            }
                        },
                        {
                            selector: 'edge',
                            style: {
                                'width': 2.8,
                                'line-color': '#7b8faa',
                                'curve-style': 'bezier',
                                'target-arrow-color': '#7b8faa',
                                'target-arrow-shape': 'triangle',
                                'arrow-scale': 1.2,
                                'opacity': 0.7
                            }
                        },
                        {
                            selector: 'edge:hover',
                            style: {
                                'line-color': '#f5a742',
                                'width': 4,
                                'opacity': 1
                            }
                        }
                    ],
                    layout: {
                        name: 'grid',
                        rows: 3,
                        fit: true,
                        padding: 60,
                        animate: false,
                        avoidOverlap: true
                    },
                    wheelSensitivity: 0.4,
                    minZoom: 0.3,
                    maxZoom: 3.0,
                    userZoomingEnabled: true,
                    userPanningEnabled: true
                });

                cy.ready(() => {
                    cy.fit(60);
                    cy.center();
                });

                // 悬停效果
                cy.on('mouseover', 'node', (evt) => {
                    evt.target.style({ 'transform': 'scale(1.08)', 'shadow-blur': 20, 'z-index': 999 });
                });
                cy.on('mouseout', 'node', (evt) => {
                    evt.target.style({ 'transform': 'scale(1)', 'shadow-blur': 10 });
                });

                // 涟漪动画
                function addRipple(x, y) {
                    const ripple = document.createElement('div');
                    ripple.className = 'ripple';
                    ripple.style.left = (x - 25) + 'px';
                    ripple.style.top = (y - 25) + 'px';
                    ripple.style.width = '50px';
                    ripple.style.height = '50px';
                    document.body.appendChild(ripple);
                    setTimeout(() => ripple.remove(), 600);
                }

                // 清理参考文献字样
                function removeReferences(text) {
                    if (!text) return text;
                    return text.replace(/[【\[]?参考文献[:\s]*[^\\n<]*/gi, '')
                               .replace(/[（(]?参考[：:]\s*[^\\n<]*/gi, '')
                               .replace(/[（(]?学术支撑[：:]\s*[^\\n<]*/gi, '')
                               .replace(/\*\*参考文献\*\*：?[^\n]*/gi, '')
                               .replace(/\*\*参考\*\*：?[^\n]*/gi, '')
                               .replace(/\n\s*\n/g, '\n');
                }

                // 生成详情页面（包含 MathJax 渲染）
                function generateDetailPageContent(nodeId) {
                    const nodeData = nodesData.find(n => n.id === nodeId);
                    if (!nodeData) return "<html><body><h2>知识点不存在</h2></body></html>";
                    let { label, knowledgePoints, engineeringCase, aiExtension, group } = nodeData;
                    engineeringCase = removeReferences(engineeringCase);
                    aiExtension = removeReferences(aiExtension);
                    
                    const groupName = group === 1 ? '🔵 核心定义' : (group === 2 ? '🟢 判别方法' : (group === 3 ? '🟠 几何与解结构' : '🔴 AI前沿与计算'));
                    const groupColor = group === 1 ? '#2C6E9E' : (group === 2 ? '#3BA99C' : (group === 3 ? '#E67E22' : '#9B59B6'));
                    
                    let knowledgeHtml = '<ol style="margin:0; padding-left:1.2rem;">';
                    knowledgePoints.forEach(point => {
                        knowledgeHtml += `<li style="margin-bottom:0.5rem;">${point}</li>`;
                    });
                    knowledgeHtml += '</ol>';
                    
                    const formatText = (text) => {
                        let formatted = text.replace(/\n/g, '<br>')
                                           .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
                        formatted = formatted.replace(/工程案例：/g, '案例：');
                        formatted = formatted.replace(/AI\+科技应用：/g, '应用前沿：');
                        formatted = formatted.replace(/```python(.*?)```/gs, '<pre style="background:#1e293b; color:#e2e8f0; padding:12px; border-radius:12px; overflow-x:auto; font-family:monospace;">$1</pre>');
                        return formatted;
                    };
                    
                    let engHtml = formatText(engineeringCase);
                    let aiHtml = formatText(aiExtension);
                    
                    return `<!DOCTYPE html>
                    <html>
                    <head><meta charset="UTF-8"><title>知识图谱 · ${label.replace(/\n/g, ' ')}</title>
                    <script>
                        window.MathJax = {
                            tex: { inlineMath: [['$', '$'], ['\\\\(', '\\\\)']], displayMath: [['$$', '$$'], ['\\\\[', '\\\\]']], processEscapes: true },
                            options: { ignoreHtmlClass: 'no-mathjax' }
                        };
                    <\/script>
                    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js" id="MathJax-script" async><\/script>
                    <style>
                        body { font-family: 'Segoe UI', 'PingFang SC', system-ui; background: #f1f5f9; margin: 0; padding: 2rem; }
                        .container { max-width: 1200px; margin: 0 auto; }
                        .card { background: white; border-radius: 2rem; padding: 2rem; box-shadow: 0 20px 35px -12px rgba(0,0,0,0.15); margin-bottom: 2rem; }
                        .badge { display: inline-block; background: ${groupColor}; color: white; padding: 6px 18px; border-radius: 40px; font-size: 0.85rem; font-weight: 600; margin-bottom: 1rem; }
                        h1 { font-size: 2rem; margin: 0.2rem 0 0.5rem 0; color: #0f172a; }
                        .knowledge-box { background: #eef2ff; padding: 1.2rem; border-radius: 1.5rem; margin: 1.2rem 0; border-left: 6px solid ${groupColor}; }
                        .section-title { font-size: 1.6rem; margin: 1.5rem 0 0.8rem 0; border-left: 6px solid ${groupColor}; padding-left: 1rem; }
                        .case-box, .ai-box { background: #f8fafc; padding: 1.4rem; border-radius: 1.5rem; margin: 1rem 0; line-height: 1.6; border: 1px solid #e2e8f0; }
                        .ai-box { background: #fef2e8; border-left: 6px solid #9B59B6; }
                        button { background: #e2e8f0; border: none; padding: 10px 28px; border-radius: 40px; font-size: 1rem; cursor: pointer; margin-top: 1rem; font-weight: 500; transition: 0.2s; }
                        button:hover { background: #cbd5e1; transform: scale(0.98); }
                        hr { margin: 1.8rem 0; border: 1px solid #e2e8f0; }
                        pre { background: #0f172a; color: #e2e8f0; padding: 1rem; border-radius: 1rem; overflow-x: auto; font-family: monospace; white-space: pre-wrap; }
                        ol { margin: 0.5rem 0 0 1rem; }
                        li { margin-bottom: 0.6rem; line-height: 1.5; }
                    </style>
                    </head>
                    <body>
                    <div class="container">
                        <div class="card">
                            <div class="badge">${groupName}</div>
                            <h1>${label.replace(/\n/g, ' ')}</h1>
                            <div class="knowledge-box">
                                <strong>📖 知识点</strong>
                                ${knowledgeHtml}
                            </div>
                            <div class="section-title">📚 拓展练习（含典型例题）</div>
                            <div class="case-box">${engHtml}</div>
                            <div class="section-title">🤖 应用前沿</div>
                            <div class="ai-box">${aiHtml}</div>
                            <hr>
                            <div style="text-align: right;">
                                <button onclick="window.close()">✖ 关闭窗口，返回知识图谱</button>
                            </div>
                        </div>
                    </div>
                    </body>
                    </html>`;
                }

                // 节点点击事件
                cy.on('tap', 'node', (evt) => {
                    const node = evt.target;
                    const pos = node.renderedPosition();
                    if (pos) addRipple(pos.x, pos.y);
                    const htmlContent = generateDetailPageContent(node.id());
                    const blob = new Blob([htmlContent], { type: 'text/html' });
                    const url = URL.createObjectURL(blob);
                    window.open(url, '_blank');
                    setTimeout(() => URL.revokeObjectURL(url), 30000);
                });

                // 控制按钮
                document.getElementById('btnReset').addEventListener('click', () => {
                    cy.layout({ name: 'grid', rows: 3, fit: true, padding: 60, animate: true, avoidOverlap: true }).run();
                    setTimeout(() => cy.fit(60), 300);
                });
                document.getElementById('btnZoomIn').addEventListener('click', () => cy.zoom({ level: cy.zoom() * 1.2 }));
                document.getElementById('btnZoomOut').addEventListener('click', () => cy.zoom({ level: cy.zoom() * 0.85 }));
                document.getElementById('btnFit').addEventListener('click', () => cy.fit(50));
                window.addEventListener('resize', () => cy.fit(50));
            } catch (error) {
                console.error(error);
                const errDiv = document.createElement('div');
                errDiv.className = 'error-message';
                errDiv.innerText = '图谱加载失败，请刷新页面重试。';
                document.body.appendChild(errDiv);
                setTimeout(() => errDiv.remove(), 5000);
            }
        });
    })();
</script>
</body>
</html>
